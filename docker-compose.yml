services:
  # 🐬 Database
  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql_face_auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "face_attendance"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 🐘 phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: pma_face_auth
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "123456"

  # 🐍 Backend (Python)
  backend:
    build: ./backend
    container_name: backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # 🚀 สำคัญ: ใน Docker ต้องเชื่อมหา DB ด้วยชื่อ service "db"
      DATABASE_URL: "mysql+pymysql://root:123456@db:3306/face_attendance"
    depends_on:
      - db

  # ⚛️ Frontend (Next.js)
